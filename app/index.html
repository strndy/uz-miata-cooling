<style>

.stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }

<script>// 1D cooling-loop model, 3UZ-FE in NA Miata. JS port of scripts/uz-cooling-1d.py (same physics, more knobs).
// Loop: pump -> engine -> outlet(ECT) -+-> rad (via inlet-side thermostat) -+-> inlet housing (pellet) -> pump
//                                      +-> bypass 28mm (+restrictor) ------+
//                                      +-> heater core (optional) ---------+
(function (root) {
  const RHO_AIR = 1.16, CP_AIR = 1007, RHO = 1030;
  const HALF_RHO = RHO / 2 * 1e-9;                    // k[kPa/(L/s)^2] = K*HALF_RHO/A^2
  const area = d_mm => Math.PI / 4 * (d_mm / 1000) ** 2;
  const kK = (K, d) => K * HALF_RHO / area(d) ** 2;
  const kOrif = cdA => HALF_RHO / cdA ** 2;
  function kRestrictor(d, D = 28) {                   // sleeve in 28mm bore: contraction + Borda expansion
    if (d >= D) return 0;
    const b2 = (d / D) ** 2;
    return kK(0.5 * (1 - b2) ** 0.75 + (1 - b2) ** 2, d);
  }
  const torqueWot = rpm => 434 - 66 * ((rpm - 3400) / 2200) ** 2;   // 3UZ-FE stock
  const GEAR_TOP = [18, 27, 37, 48, 62];   // m/s at 6200 rpm per gear (fixed gearing)
  let SHIFT = 6500;
  function rpmFromV(v) {
    for (const g of GEAR_TOP) if (v <= 0.98 * g * SHIFT / 6200) return Math.max(1500, 6200 * v / g);
    return SHIFT;
  }
  const LAP = [[12, 22, 5], [6, 28, 4], [20, 18, 7], [8, 25, 5], [10, 30, 4], [9, 20, 10]]; // wot s, corner m/s, off s

  const DEFAULTS = {
    hp: 290, wot: 65, vTrack: 141, tAir: 30, minutes: 20, tStart: 70,   // vTrack = lap average speed km/h
    duct: 50,            // 0 none .. 100 perfect -> face velocity = (0.10 + 0.30*duct/100) * car speed
    core: 42,            // radiator core depth mm (Miata frame face 560x340)
    bypass: 28,          // restrictor bore mm; 28 = open (stock), 0 = blocked
    heater: true,        // heater loop flows (Miata has no heater valve); false = heater deleted
    stat: true, statOpen: 82,
    pulley: 1.0,         // pump speed / crank speed
    glycol: 50, cap: 1.1,
    ww: false,           // Water Wetter (surfactant): ~+8% coolant-side heat transfer
    ocPct: 0, ocThick: 42, ocMount: 'front', ocModel: 'custom',
    ocStat: true, ocOpen: 80,   // oil thermostat (sandwich plate): opens at ocOpen, full at +10
    fc: 0.75, fOil: 0.22, shift: 6500,
  };

  // Lap: six straights. All speeds (corners, top-speed asymptote, start) scale by f; f is solved so the
  // lap average matches vTrack (f = 1 -> ~141 km/h fast circuit, f ~ 0.4 -> ~60 km/h tight track).
  function lapAt(o, dt, f) {
    const th = [], vs = [], rs = [];
    const sw = (o.wot / 100) / 0.65, so = (1 - o.wot / 100) / 0.35;
    const a0 = 5 * (o.hp / 290) ** 0.6, vmax = 65 * f;
    let v = 22 * f, acc = 0;
    for (const [w, vc, off] of LAP) {
      for (let i = 0, n = Math.round(w * sw / dt); i < n; i++) {
        v += dt * a0 * (1 - (v / vmax) ** 2); th.push(1); vs.push(v); rs.push(rpmFromV(v)); acc += v;
      }
      for (let i = 0, n = Math.round(off * so / dt); i < n; i++) {
        v = Math.max(vc * f, v - 9 * dt); th.push(0); vs.push(v); rs.push(rpmFromV(v)); acc += v;
      }
    }
    return { th, vs, rs, avg: acc / vs.length * 3.6 };
  }
  function lapProfile(o, dt) {
    let f = o.vTrack / 141, L = lapAt(o, dt, f);
    for (let k = 0; k < 4 && Math.abs(L.avg - o.vTrack) > 0.5; k++) { f *= o.vTrack / L.avg; L = lapAt(o, dt, f); }
    return L;
  }

  function run(opts) {
    const o = Object.assign({}, DEFAULTS, opts);
    SHIFT = o.shift;
    const dt = 0.02, steps = Math.round(o.minutes * 60 / dt), every = Math.round(1 / dt);
    const CP = 4190 - 11.8 * o.glycol;
    // coolant-side heat transfer vs mix: glycol is more viscous, worse conductor (h ~ -35% at 50/50 vs water).
    // Normalised to 1.0 at 50/50 so the calibration holds; Water Wetter adds ~8%.
    const hMul = (1 - 0.007 * o.glycol) / 0.65 * (o.ww ? 1.08 : 1);
    const T_boil = 100 + 0.12 * o.glycol + 20 * o.cap;
    const P = {
      p0: 150, c_pump: 4.0, k_eng: 4.44,
      k_rad_fixed: 2.4 + kK(3.0, 38) + kK(0.3, 32),
      k_bypass: kK(2.5, 28), k_heater: kK(12, 16),
      cdA_full: 0.6 * Math.PI * 0.034 * 0.010, cdA_jig: 0.6 * area(2),   // ~34 mm valve, 10 mm lift (Toyota spec: >=10 mm at 95C)
      m_metal_cp: 80 * 900, C_oil: 6 * 0.85 * 2100, hA_oil_cool: 800, hA_housing: 15,
      V_eng: 5.5, V_up: 0.8, V_rad: 2.4, V_low: 0.8, V_bp: 0.2, V_mix: 0.3,
      hA_j: 4000, Qj: 3.0, hA_j_min: 800,
      face: 0.56 * 0.34, hA_air_ref: 1700, v_ref: 7, hA_cool_ref: 6000, Qc_ref: 2, hA_cool_min: 1500,
      fan_min: 2.5, q_off: 8000 * o.hp / 290,
      oc_block: 0.75, oc_flow: 15, oc_open: o.ocOpen, oc_full: o.ocOpen + 10,
    };
    const ductF = 0.10 + 0.30 * o.duct / 100;
    const dpt = o.core / 42;
    const kBp = o.bypass <= 0 ? null : P.k_bypass + kRestrictor(o.bypass);
    const kH = o.heater ? P.k_heater : null;
    const statFull = o.statOpen + 8, tau = 15;
    const oc = o.ocPct > 0 ? o.ocMount : 'none';
    const ocFrac = o.ocPct / 100;
    const { th, vs, rs } = lapProfile(o, dt);
    const nlap = th.length;
    const nUp = 6, nRad = 12, nLow = 6, nBp = 3;
    const T0 = o.tStart;
    const up = new Float64Array(nUp).fill(T0), rad = new Float64Array(nRad).fill(T0),
      low = new Float64Array(nLow).fill(T0), bp = new Float64Array(nBp).fill(T0);
    let Teng = T0, Tmix = T0, Tmetal = T0 + 3, Tsense = T0, Toil = T0;
    const adv = (cells, Tin, mdot, V) => {
      if (mdot <= 0) return;
      const a = mdot * CP * dt / (V / 1000 / cells.length * RHO * CP);
      for (let k = cells.length - 1; k > 0; k--) cells[k] += a * (cells[k - 1] - cells[k]);
      cells[0] += a * (Tin - cells[0]);
    };
    const epsX = (NTU, Cr) => Cr < 1e-6 ? 1 - Math.exp(-NTU)
      : 1 - Math.exp((NTU ** 0.22 / Cr) * (Math.exp(-Cr * NTU ** 0.78) - 1));
    const log = { t: [], ect: [], oil: [], metal: [], radIn: [], radOut: [], mix: [], lift: [],
      Qr: [], Qb: [], Qh: [], qIn: [], qRad: [], qOc: [], v: [], tPre: [] };
    let qRad = 0, qOc = 0, Tpre = o.tAir;
    const net = (s, kR) => {   // flow network at pump speed s (=rpm/6000) for radiator-path k
      const sr = 1 / Math.sqrt(kR), sb = kBp ? 1 / Math.sqrt(kBp) : 0, sh = kH ? 1 / Math.sqrt(kH) : 0;
      const sum = sr + sb + sh, Q = s * Math.sqrt(P.p0 / (P.c_pump + P.k_eng + 1 / sum ** 2));
      return { Q, Qr: Q * sr / sum, Qb: Q * sb / sum, Qh: Q * sh / sum };
    };
    const kStatFull = kOrif(P.cdA_jig + P.cdA_full), kRestr = o.bypass > 0 ? kRestrictor(o.bypass) : 0;
    const iWin = Math.max(0, steps - Math.round(Math.min(300, o.minutes * 15) / dt));
    const H = { n: 0, s: 0, pump: 0, eng: 0, core: 0, hose: 0, stat: 0, bp: 0, restr: 0, heater: 0, Q: 0, Qr: 0, lift: 0 };
    for (let i = 0; i < steps; i++) {
      const j = i % nlap, thr = th[j], v = vs[j], rpm = rs[j];
      const s = rpm * o.pulley / 6000;
      let x = 1, kR = P.k_rad_fixed;
      if (o.stat) {
        x = Math.min(1, Math.max(0, (Tsense - o.statOpen) / (statFull - o.statOpen)));
        kR += kOrif(P.cdA_jig + x * P.cdA_full);
      }
      const { Q, Qr, Qb, Qh } = net(s, kR);
      if (i >= iWin) {   // pressure-drop bookkeeping over the last 5 min (kPa)
        H.n++; H.s += s; H.Q += Q; H.Qr += Qr; H.lift += x;
        H.pump += P.p0 * s * s - P.c_pump * Q * Q; H.eng += P.k_eng * Q * Q;
        H.core += 2.4 * Qr * Qr; H.hose += (P.k_rad_fixed - 2.4) * Qr * Qr; H.stat += (kR - P.k_rad_fixed) * Qr * Qr;
        H.bp += P.k_bypass * Qb * Qb; H.restr += kRestr * Qb * Qb; H.heater += kH ? kH * Qh * Qh : 0;
      }
      const mr = Qr * RHO / 1000, mb = Qb * RHO / 1000, mh = Qh * RHO / 1000, m = Q * RHO / 1000;

      const qIn = thr ? o.fc * torqueWot(rpm) * (o.hp / 290) * rpm * 2 * Math.PI / 60 : P.q_off;
      const hAj = Math.max(P.hA_j_min, P.hA_j * (Q / P.Qj) ** 0.8) * hMul;
      const qmc = hAj * (Tmetal - Teng);
      const qoc_ = P.hA_oil_cool * (Toil - Teng);
      Tmetal += dt * ((1 - o.fOil) * qIn - qmc) / P.m_metal_cp;
      Teng += dt * (qmc + qoc_ + m * CP * (Tmix - Teng)) / (P.V_eng / 1000 * RHO * CP);

      // air side
      const vFace = Math.max(P.fan_min, ductF * v);

const ductWord = d => d < 15 ? 'none, air spills around' : d < 40 ? 'loose shroud' : d < 65 ? 'basic shroud' : d < 88 ? 'sealed duct' : 'sealed duct + hood vent';
function describe(o) {
  const p = [];
  p.push(o.bypass <= 0 ? 'bypass blocked' : o.bypass >= 28 ? 'bypass open' : `${o.bypass} mm restrictor`);
  p.push(o.stat ? `stat ${o.statOpen}°C` : 'no stat');
  p.push(`${o.core} mm rad`, `duct ${o.duct}%`);
  if (o.ocPct > 0) { const m = OC_MODELS.find(x => x.id === o.ocModel); p.push(`oil cooler ${m && m.w ? m.short : o.ocPct + '%'} ${o.ocMount === 'front' ? 'front' : 'own duct'}`); }
  if (!o.heater) p.push('heater deleted');
  if (o.glycol !== D.glycol) p.push(`${o.glycol}% glycol`);
  if (o.ww) p.push('Water Wetter');
  if (o.ocPct > 0 && !o.ocStat) p.push('no oil stat');
  if (o.ocPct > 0 && o.ocStat && o.ocOpen !== D.ocOpen) p.push(`oil stat ${o.ocOpen}°C`);
  if (o.tAir !== D.tAir) p.push(`${o.tAir}°C air`);
  if (o.hp !== D.hp) p.push(`${o.hp} hp`);
  if (o.wot !== D.wot) p.push(`${o.wot}% WOT`);
  if (o.vTrack !== D.vTrack) p.push(`track avg ${o.vTrack} km/h`);
  if (o.pulley !== D.pulley) p.push(`pump ×${o.pulley}`);
  if (o.fc !== D.fc) p.push(`heat ${o.fc}`);
  if (o.shift !== D.shift) p.push(`shift ${o.shift}`);

}

function Slider({ id, label, value, min, max, step = 1, unit = '', fmt, hint, ends, onChange, disabled }) {

function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function Chart({ title, series, x, yUnit, refs = [], bands = [], yMin, yMax, height = 230, legend = true }) {
  const [ref, W] = useWidth();
  const H = W < 480 ? Math.round(height * 0.85) : height, L = 40, R = 10, T = 22, B = 26;
  const all = series.flatMap(s => s.y);
  let lo = yMin ?? Math.min(...all), hi = yMax ?? Math.max(...all);
  refs.forEach(r => { if (r.y > hi && r.y < hi * 1.25) hi = r.y; });
  if (yMin == null) lo = Math.floor(lo / 10) * 10; if (yMax == null) hi = Math.ceil((hi + 2) / 10) * 10;
  const xMax = Math.max(...series.map(s => (s.x || x)[(s.x || x).length - 1]));
  const sx = v => L + (v / xMax) * (W - L - R), sy = v => T + (1 - (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo)) * (H - T - B);
  const path = (xs, ys) => { let d = ''; const st = Math.max(1, Math.floor(xs.length / 600));
    for (let i = 0; i < xs.length; i += st) d += (d ? 'L' : 'M') + sx(xs[i]).toFixed(1) + ' ' + sy(ys[i]).toFixed(1); return d; };
  const yt = niceTicks(lo, hi, 5), xt = niceTicks(0, xMax, 6);
  return html`<div class="panel chart">
    <h3>${title}</h3>
    <div ref=${ref}><svg viewBox=${`0 0 ${W} ${H}`} width=${W} height=${H} role="img" aria-label=${title}>
      ${bands.map(b => html`<rect x=${L} width=${W - L - R} y=${sy(b.to)} height=${Math.max(0, sy(b.from) - sy(b.to))} fill=${b.color} opacity="0.12" />`)}
      ${yt.map(v => html`<g><line x1=${L} x2=${W - R} y1=${sy(v)} y2=${sy(v)} stroke="var(--line)" stroke-width="1" />
        <text x=${L - 6} y=${sy(v) + 4} text-anchor="end" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">${v}</text></g>`)}
      ${xt.filter(v => sx(v) < W - R - 30).map(v => html`<text x=${sx(v)} y=${H - 10} text-anchor="middle" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">${v}</text>`)}
      <text x=${W - R} y=${H - 10} text-anchor="end" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">min</text>
      <text x=${4} y=${11} text-anchor="start" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">${yUnit}</text>
      ${refs.filter(r => r.y >= lo && r.y <= hi).map(r => html`<g><line x1=${L} x2=${W - R} y1=${sy(r.y)} y2=${sy(r.y)} stroke=${r.color} stroke-dasharray="4 4" stroke-width="1.2" />
        <text x=${W - R - 4} y=${sy(r.y) - 5} text-anchor="end" font-size="11" font-family="var(--f-body)" fill=${r.color}>${r.label}</text></g>`)}
      ${series.map(s => html`<path d=${path(s.x || x, s.y)} fill="none" stroke=${s.color} stroke-width=${s.w || 1.6} stroke-dasharray=${s.dash || 'none'} stroke-linejoin="round" opacity=${s.op || 1} />`)}
    </svg></div>
    ${legend && html`<div class="legend">${series.filter(s => s.label).map(s => html`<span><i style=${{ background: s.color, opacity: s.op || 1 }}></i>${s.label}</span>`)}</div>`}
  </div>`;
}
const lapAvg = (a, n = 100) => { const out = new Array(a.length); let acc = 0; const q = [];
  for (let i = 0; i < a.length; i++) { acc += a[i]; q.push(a[i]); if (q.length > n) acc -= q.shift(); out[i] = acc / q.length; } return out; };

function Hydraulics({ h, o }) {
  const radPath = h.core + h.hose + h.stat;
  const rows = [
    ['Pump head', h.pump, 'var(--ink)', 'what the pump makes at this flow'],
    ['Block + heads', h.eng, 'var(--muted)', 'in series with everything'],
    ['Radiator core', h.core, 'var(--cold)', 'radiator path'],
    ['Hoses + 32 mm necks', h.hose, 'var(--cold)', 'radiator path'],
    [o.stat ? `Thermostat (${h.lift.toFixed(0)}% open)` : 'Thermostat (removed)', h.stat, 'var(--accent)', 'radiator path'],
    ...(o.bypass > 0 ? [['Bypass passage 28 mm', h.bp, 'var(--warn)', 'bypass path'],
      ...(o.bypass < 28 ? [[`Restrictor ${o.bypass} mm`, h.restr, 'var(--warn)', 'bypass path']] : [])] : []),
    ...(o.heater ? [['Heater loop', h.heater, 'var(--violet)', 'heater path']] : []),
  ];
  const mx = Math.max(...rows.map(r => r[1]), 1), so = h.statOpen;
  const gain = 100 * (so.QrWithout / so.QrWith - 1);
  return html`<div class="panel hyd">
    <h3>Pressure drop, last 5 min average</h3>
    <div class="hyd-rows">${rows.map(([l, v, c, n]) => html`<div class="hyd-row">
      <span class="hl">${l}<small>${n}</small></span>
      <span class="hb"><i style=${{ width: (100 * v / mx).toFixed(1) + '%', background: c }}></i></span>
      <span class="hv">${v.toFixed(1)} kPa</span></div>`)}</div>
    <p class="hyd-note">Parallel paths share one pressure drop: radiator path ${radPath.toFixed(1)} kPa${o.bypass > 0 ? `, bypass ${(h.bp + h.restr).toFixed(1)}` : ''}${o.heater ? `, heater ${h.heater.toFixed(1)}` : ''}.
      Pump ${h.Q.toFixed(0)} L/min at ~${h.rpm.toFixed(0)} rpm average.</p>
    <p class="hyd-call"><b>A new, fully open thermostat</b> (34 mm valve, 10 mm lift) is ${(100 * so.share).toFixed(0)}% of the radiator path's resistance:
      ${so.dp.toFixed(1)} kPa here. Without it the radiator would get ${so.QrWithout.toFixed(0)} instead of ${so.QrWith.toFixed(0)} L/min (+${gain.toFixed(0)}%).
      Toggle "Thermostat fitted" off to see what that does to temperature.</p>
  </div>`;
}

// Settings <-> URL query (?bypass=14&core=60...). Only values that differ from the defaults go in the link.
function fromQuery() {
  const out = { ...D };
  try {
    const q = new URLSearchParams(location.search);
    for (const [k, v] of q) {
      if (!(k in D)) continue;
      const d = D[k];
      if (typeof d === 'boolean') out[k] = v === '1' || v === 'true';
      else if (typeof d === 'number') { const n = parseFloat(v); if (Number.isFinite(n)) out[k] = n; }
      else out[k] = v;
    }
  } catch (e) {}
  return out;
}
function toQuery(o) {
  const q = new URLSearchParams();
  for (const k of Object.keys(D)) if (o[k] !== D[k]) q.set(k, typeof D[k] === 'boolean' ? (o[k] ? '1' : '0') : String(o[k]));
  const str = q.toString();
  return location.origin + location.pathname + (str ? '?' + str : '');
}

function App() {

    const url = toQuery(o);
    const done = () => { setShared('Link copied'); setTimeout(() => setShared(''), 2500); };

  };

        self.onmessage = e => { const { id, kind, opts } = e.data;
          if (kind === 'main') self.postMessage({ id, kind, r: UZSim.run(opts) });
          else self.postMessage({ id, kind, band: [UZSim.run({ ...opts, fc: Math.max(0.3, opts.fc - 0.1) }).sum.ectEnd,
                                                   UZSim.run({ ...opts, fc: opts.fc + 0.1 }).sum.ectEnd] }); };`;

          <div class="stat"><span class="k">Coolant, last 5 min</span><span class="v">${s.ectEnd.toFixed(0)}<small> °C</small></span>
            <span class="s">${band ? `range ${band[0].toFixed(0)}–${band[1].toFixed(0)}°C` : ''}</span></div>
          <div class="stat"><span class="k">Oil, last 5 min</span><span class="v">${s.oilEnd.toFixed(0)}<small> °C</small></span><span class="s">${s.qOc > 0.05 ? `cooler ${s.qOc.toFixed(1)} kW` : 'no oil cooler'}</span></div>
          <div class="stat"><span class="k">Boils after</span><span class="v">${s.tBoil != null ? s.tBoil.toFixed(1) : '—'}<small>${s.tBoil != null ? ' min' : ''}</small></span><span class="s">boiling point ${s.T_boil.toFixed(0)}°C</span></div>
          <div class="stat"><span class="k">Through radiator</span><span class="v">${s.Qr.toFixed(0)}<small> L/min</small></span>
            <span class="s">${(100 * (s.Qb + s.Qh) / (s.Qr + s.Qb + s.Qh)).toFixed(0)}% skips it</span></div>
          <div class="stat"><span class="k">Heat in / radiator out</span><span class="v">${s.qIn.toFixed(0)}<small> / ${s.qRad.toFixed(0)} kW</small></span><span class="s">avg ${s.vAvg.toFixed(0)} km/h</span></div>
        </div>
        <div class="charts">
          <div class="wide"><${Chart} title="Coolant at sensor (ECT)" x=${cur.log.t} yUnit="°C" yMin=${Math.min(60, Math.floor(o.tStart / 10) * 10)} yMax=${Math.max(140, Math.ceil(Math.min(170, Math.max(...cur.log.ect, ...pinned.flatMap(p => p.log.ect))) / 10) * 10)}
            refs=${[{ y: s.T_boil, label: `boils ${s.T_boil.toFixed(0)}°C`, color: 'var(--hot)' }]}
            bands=${o.stat ? [{ from: o.statOpen, to: o.statOpen + 8, color: 'var(--accent)' }] : []}
            series=${[...pinned.filter(p => p.label !== cur.label).map((p, i) => ({ x: p.log.t, y: p.log.ect, color: RUN_COLORS[(i + 1) % RUN_COLORS.length], w: 1.4, op: .8, label: p.label })),
              { y: cur.log.ect, color: 'var(--ink)', w: 2.4, label: 'current: ' + cur.label }]} />
          ${pinned.length > 0 && html`<div class="runs" style=${{ marginTop: '8px' }}>${pinned.map((p, i) => html`<span class="run">
            <span class="dot" style=${{ background: p.label === cur.label ? 'var(--ink)' : RUN_COLORS[(pinned.filter(q => q.label !== cur.label).indexOf(p) + 1) % RUN_COLORS.length] }}></span>
            <span class="lbl">${p.label}</span><b>${p.sum.ectEnd.toFixed(0)}°C</b>
            <button aria-label="Remove run" onClick=${() => setPinned(ps => ps.filter(q => q !== p))}>×</button></span>`)}</div>`}
          </div>
          <${Chart} title="Temperatures, current run" x=${cur.log.t} yUnit="°C" yMin=${Math.min(20, o.tAir)} yMax=${Math.min(200, Math.ceil(Math.max(...cur.log.oil, ...cur.log.metal, 140) / 10) * 10)}
            refs=${[{ y: s.T_boil, label: 'boil', color: 'var(--hot)' }]}
            series=${[{ y: cur.log.ect, color: 'var(--hot)', w: 2, label: 'ECT' }, { y: cur.log.radIn, color: 'var(--warn)', label: 'radiator in' },
              { y: cur.log.radOut, color: 'var(--cold)', label: 'radiator out' }, { y: cur.log.oil, color: 'var(--oil)', dash: '6 3', w: 1.8, label: 'oil' },
              { y: cur.log.metal, color: 'var(--muted)', dash: '2 3', label: 'head hot side (proxy)' }]} />
          <${Chart} title="Coolant flow, current run" x=${cur.log.t} yUnit="L/min" yMin=${0}
            series=${[{ y: cur.log.Qr, color: 'var(--cold)', label: 'through radiator' }, { y: cur.log.Qb, color: 'var(--warn)', label: 'through bypass' },
              ...(o.heater ? [{ y: cur.log.Qh, color: 'var(--violet)', label: 'through heater' }] : []),
              ...(o.stat ? [{ y: cur.log.lift, color: 'var(--accent)', dash: '5 3', label: 'thermostat lift %' }] : [])]} />
          <div class="wide"><${Chart} title="Heat balance, one-lap average" x=${cur.log.t} yUnit="kW" yMin=${0} height=${190}
            series=${[{ y: lapAvg(cur.log.qIn), color: 'var(--hot)', w: 2, label: 'engine heat in' }, { y: lapAvg(cur.log.qRad), color: 'var(--cold)', w: 2, label: 'radiator out' },
              ...(s.qOc > 0.05 ? [{ y: lapAvg(cur.log.qOc), color: 'var(--oil)', w: 2, label: 'oil cooler out' }] : [])]} /></div>
          <div class="wide"><${Hydraulics} h=${s.hyd} o=${cur.opts} /></div>
        </div>
        <div class="panel notes">
          <p><b>How to read this.</b> Every change re-runs a 20 min session: a lap with six straights at the chosen average speed (default 141 km/h, a fast circuit; down to 50 km/h for tight tracks), starting with the thermostat closed. When the sliders rest it also re-runs with engine heat ±0.1, which gives the range under the coolant number. Absolute temperatures are a calibrated estimate (±20°C, no 3UZ logs yet). Differences between setups are the reliable output.</p>
          <p>Model: pump curve, block, radiator, 38→32 mm necks, bypass and restrictor solved as a flow network every 20 ms. Wax thermostat with a 15 s lag on the pump-inlet side. Radiator cells with air as the limiting side. Separate oil and metal nodes. Readings above the boiling point are not physical: the coolant would boil over first.</p>
          <p>Open source: <a href="https://github.com/strndy/uz-miata-cooling" target="_blank" rel="noopener" class="src">github.com/strndy/uz-miata-cooling</a>. The README explains every equation and the calibration sources.</p>
        </div>`}
      </main>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>

</body></html>
